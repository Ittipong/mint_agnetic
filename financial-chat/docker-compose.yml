version: "3.9"

name: agentic

services:
  postgres:
    image: postgres:16-alpine
    container_name: mint-agentic
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mint_agentic
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d mint_agentic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
