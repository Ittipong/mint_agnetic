[project]
name = "mint-agentic"
version = "0.1.0"
description = "Mint Money AI Agent — LangGraph ReAct with OpenRouter Gemma + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openrouter>=0.1.0",
    "langchain-core>=0.3.0",
    "langgraph-cli[inmem]>=0.2.0",
    "psycopg[binary,pool]>=3.1.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "financial-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
financial-agent = { path = "../financial-agent", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
