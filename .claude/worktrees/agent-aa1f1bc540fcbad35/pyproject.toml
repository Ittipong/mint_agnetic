[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint_agentic_v3"
version = "0.1.0"
requires-python = ">=3.11"
description = "Mint Money LangGraph chat agent — Pure ReAct + CodeAct architecture."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests_e2e", "tests_integration"]
pythonpath = ["src", "tests_integration"]
# Discover standard `test_*.py` (unit tests in tests/), ID-prefixed files in
# tests_e2e/ (S1001_*, XC001_*), and tests_integration/ (I1001_*).
python_files = ["test_*.py", "S[0-9]*.py", "RN[0-9]*.py", "XC[0-9]*.py", "I[0-9]*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "id(test_id): stable test ID (e.g. S1001, S2001, RN001, XC001, I1001) for traceability against tests_plan_impl.md",
]
